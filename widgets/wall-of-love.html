<!--
  Wall of Love — jamesgunaca.com
  Paste this whole file into a Squarespace Code Block.

  Everything is namespaced `jg-wol`. There are no global CSS selectors and no
  globals beyond window.JgWallOfLove, so nothing here can affect the rest of the
  Squarespace template.

  Per-block configuration, no code edit required:
      <div data-jg-wol data-initial="6" data-batch="6"></div>

  Site-wide defaults can be set before this block loads:
      <script>window.JG_WOL_CONFIG = { initialCount: 12 };</script>
-->

<div
  data-jg-wol
  data-initial="24"
  data-batch="12"
></div>

<style>
/* Every rule is scoped under .jg-wol. Custom properties are declared on the
   component root rather than :root so they cannot leak into Squarespace. */
.jg-wol {
  --jg-wol-card: #D8E0EB;          /* Stone */
  --jg-wol-text: #2B2D35;          /* Midnight */
  --jg-wol-muted: #6B7280;
  --jg-wol-accent: #1B2CC2;        /* Persian */
  --jg-wol-radius: 12px;
  --jg-wol-gap: 20px;
  --jg-wol-pad: 20px;
  --jg-wol-col: 340px;
  --jg-wol-btn-w: 600px;           /* matches the site's wide primary buttons */

  --jg-wol-font-head: 'nohemi-3qocai', 'Nohemi', system-ui, sans-serif;
  --jg-wol-font-quote: 'working-1sjdck', 'Working', 'Plus Jakarta Sans', system-ui, sans-serif;
  --jg-wol-font-body: 'plus-jakarta-sans-rdo6u5', 'Plus Jakarta Sans', system-ui, sans-serif;

  padding: var(--jg-wol-pad);
  font-family: var(--jg-wol-font-body);
  color: var(--jg-wol-text);
  line-height: 1.55;
}

.jg-wol *,
.jg-wol *::before,
.jg-wol *::after { box-sizing: border-box; }

/* Neutralise the host template's own element styling.
   Squarespace styles blockquote, figure, figcaption, p, ul and li globally,
   with selectors like `.sqs-block-content blockquote` that out-specify a plain
   `.jg-wol blockquote`. Its blockquote rule is what drew a blue rule down the
   left of every quote. Each selector below pairs the element with a class we
   own, which raises specificity above the host's and wins. */
.jg-wol figure.jg-wol__figure,
.jg-wol blockquote.jg-wol__quote,
.jg-wol p.jg-wol__text,
.jg-wol ul.jg-wol__grid,
.jg-wol li.jg-wol__card,
.jg-wol li.jg-wol__skeleton,
.jg-wol figcaption.jg-wol__by,
.jg-wol div.jg-wol__who,
.jg-wol div.jg-wol__name,
.jg-wol a.jg-wol__name,
.jg-wol div.jg-wol__meta {
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  text-indent: 0;
  quotes: none;
  text-align: inherit;
  list-style: none;
  font-style: normal;      /* the host italicises blockquote */
  letter-spacing: normal;
  text-transform: none;
}

.jg-wol blockquote.jg-wol__quote::before,
.jg-wol blockquote.jg-wol__quote::after,
.jg-wol p.jg-wol__text::before,
.jg-wol p.jg-wol__text::after { content: none; }

.jg-wol img { max-width: 100%; border: 0; }

/* The widget's own <section> and <div> wrappers.
   This site's stylesheet contains bare `section{margin-top:5em}`,
   `section{margin:2em 0}`, `section{display:flex;align-items:center}` and
   min-height rules up to 100vh. All of that landed on the widget's section and
   added a viewport of blank space below the wall. `!important` is deliberate
   here: this is a defensive reset for an embedded widget dropped into a CMS
   whose selectors we cannot see or predict, and it applies only to the
   widget's own wrappers. */
.jg-wol section.jg-wol__section,
.jg-wol div.jg-wol__foot,
.jg-wol div.jg-wol__note,
.jg-wol p.jg-wol__noteText {
  display: block !important;
  position: static !important;
  min-height: 0 !important;
  max-height: none !important;
  height: auto !important;
  width: auto !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  align-items: normal !important;
  justify-content: normal !important;
  float: none !important;
  background: none;
  font-size: inherit;
  line-height: inherit;
}

/* Masonry via grid row spans rather than CSS multi-column.
   Multi-column was the obvious choice and worked in Chrome, but Safari's
   multicol implementation mis-measures the column box and left a viewport of
   empty space below the wall on desktop. Mobile was unaffected because a
   single column never triggers the balancing.

   Instead the grid uses 1px auto-rows and JavaScript sets each card's
   grid-row-end to span its own measured height. That gives the same
   pull-up-into-the-gap layout, in row-major DOM order, with no reliance on
   multicol. Without JavaScript the grid still renders as a plain equal-row
   grid, which is a reasonable fallback. */
.jg-wol ul.jg-wol__grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(var(--jg-wol-col), 1fr));
  column-gap: var(--jg-wol-gap);
  row-gap: var(--jg-wol-gap);
  align-items: start;
}

/* Applied by JS once it can measure. Row gap moves into the span so that a
   card's height and its gutter are one unit. */
.jg-wol ul.jg-wol__grid--masonry {
  grid-auto-rows: 1px;
  row-gap: 0;
}

.jg-wol li.jg-wol__card {
  display: block;
  /* No margin: in masonry mode the gutter is part of the row span, and a stray
     margin from the host template would break the flat top edge of the wall. */
  margin: 0;
  background: var(--jg-wol-card);
  border-radius: var(--jg-wol-radius);
  padding: 24px;
  transition: opacity .3s ease, transform .3s ease;
}

/* Newly revealed cards fade in rather than snapping into place. */
.jg-wol li.jg-wol__card--enter {
  opacity: 0;
  transform: translateY(8px);
}

@media (prefers-reduced-motion: reduce) {
  .jg-wol li.jg-wol__card { transition: none; }
  .jg-wol li.jg-wol__card--enter { opacity: 1; transform: none; }
}

/* Attribution — first in the card, so the person leads. */
.jg-wol figcaption.jg-wol__by {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 0 0 16px;
}

.jg-wol img.jg-wol__avatar,
.jg-wol span.jg-wol__monogram {
  width: 54px;
  height: 54px;
  flex: 0 0 54px;
  border: 0;
  /* Element+class, because the host styles bare `img` at a specificity that
     would otherwise square off the avatars. */
  border-radius: 50%;
  object-fit: cover;
}

.jg-wol span.jg-wol__monogram {
  display: grid;
  place-items: center;
  font-family: var(--jg-wol-font-head);
  font-size: 1.1rem;
  font-weight: 600;
  color: #FFFFFF;
  background: var(--jg-wol-accent);
}

.jg-wol div.jg-wol__who { min-width: 0; }

.jg-wol .jg-wol__name {
  font-family: var(--jg-wol-font-head);
  font-weight: 600;
  font-size: 1.2rem;
  line-height: 1.25;
  overflow-wrap: anywhere;
}

.jg-wol div.jg-wol__meta {
  font-family: var(--jg-wol-font-head);
  font-weight: 400;
  font-size: 1.02rem;
  line-height: 1.3;
  color: var(--jg-wol-muted);
  overflow-wrap: anywhere;
}

/* Quote */
.jg-wol p.jg-wol__text {
  font-family: var(--jg-wol-font-quote);
  font-size: 1.3rem;
  line-height: 1.6;
  white-space: pre-line;      /* keep author line breaks, still plain text */
  overflow-wrap: anywhere;
}

.jg-wol__text--clamped {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 12;
  line-clamp: 12;
  overflow: hidden;
}

.jg-wol button.jg-wol__more {
  display: inline-block;
  margin: 10px 0 0;
  padding: 0;
  border: 0;
  background: none;
  font-family: var(--jg-wol-font-head);
  font-size: 1.02rem;
  font-weight: 600;
  color: var(--jg-wol-accent);
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
}

/* Any `display` declaration beats the UA stylesheet's `[hidden]{display:none}`,
   so setting .hidden = true on this button was not enough to remove it: the
   rule above kept it visible on quotes that were never clipped. */
.jg-wol button.jg-wol__more[hidden] { display: none !important; }

.jg-wol img.jg-wol__shot {
  display: block;
  width: 100%;
  height: auto;
  margin-top: 16px;
  border: 0;
  border-radius: 8px;
}

.jg-wol .jg-wol__link {
  color: inherit;
  text-decoration: none;
}
.jg-wol .jg-wol__link:hover,
.jg-wol .jg-wol__link:focus-visible { text-decoration: underline; text-underline-offset: 3px; }

/* Controls and states */
.jg-wol div.jg-wol__foot { margin-top: 30px !important; text-align: center; }

/* Full width up to --jg-wol-btn-w, so it reads at the same weight as the
   site's own primary buttons rather than a small pill beside them. */
.jg-wol div.jg-wol__foot button.jg-wol__btn {
  width: 100%;
  max-width: var(--jg-wol-btn-w);
}

/* Sized to sit alongside Squarespace's own primary buttons, which on this site
   compute to about 20px at weight 700 with 1rem/1.2rem padding. */
.jg-wol button.jg-wol__btn {
  font-family: var(--jg-wol-font-head);
  font-weight: 700;
  font-size: 1.27rem;
  line-height: 1.2;
  color: #FFFFFF;
  background: var(--jg-wol-accent);
  border: 0;
  border-radius: 999px;
  padding: 1rem 2.4rem;
  cursor: pointer;
}
.jg-wol button.jg-wol__btn[hidden] { display: none; }

.jg-wol button.jg-wol__btn--ghost {
  color: var(--jg-wol-accent);
  background: transparent;
}

.jg-wol :is(button, a):focus-visible {
  outline: 2px solid var(--jg-wol-accent);
  outline-offset: 3px;
  border-radius: 4px;
}

.jg-wol div.jg-wol__note {
  border-radius: var(--jg-wol-radius);
  background: var(--jg-wol-card) !important;
  padding: 38px 22px !important;
  text-align: center;
  color: var(--jg-wol-muted);
  font-size: 1.1rem;
}
.jg-wol p.jg-wol__noteText { margin: 0 0 14px !important; }
.jg-wol p.jg-wol__noteText:last-child { margin-bottom: 0 !important; }

.jg-wol li.jg-wol__skeleton {
  margin: 0;
  border-radius: var(--jg-wol-radius);
  background: var(--jg-wol-card);
  opacity: .55;
  min-height: 190px;
}

/* Screen-reader-only, scoped so it cannot collide with Squarespace's own. */
.jg-wol__sr {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

@media (max-width: 600px) {
  .jg-wol { --jg-wol-col: 260px; --jg-wol-gap: 16px; --jg-wol-pad: 16px; }
  .jg-wol li.jg-wol__card { padding: 20px; }
}
</style>

<script>
(function () {
  'use strict';

  var DEFAULTS = {
    endpoint: 'https://media.jamesgunaca.com/testimonials/approved.json',
    initialCount: 24,
    batchSize: 12,
    // 'hourly' lets the CDN cache the feed within the hour while guaranteeing a
    // refresh after moderation changes. 'none' caches normally; 'always' bypasses.
    cacheBusting: 'hourly',
    label: 'What people say about working with James',
    loadMoreLabel: 'load more',
    emptyMessage: 'No testimonials to show just yet.',
    errorMessage: 'Testimonials could not be loaded right now.',
    theme: {}
  };

  /* ---------------------------------------------------------------- utils */

  /** Build an element. Text is always assigned via textContent, never HTML. */
  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null && text !== '') node.textContent = String(text);
    return node;
  }

  /**
   * Only http(s) URLs are ever emitted. This is what stops a `javascript:` or
   * `data:` value in Notion from becoming a live link or image source.
   */
  function safeUrl(value) {
    if (typeof value !== 'string') return null;
    var trimmed = value.trim();
    if (!trimmed) return null;
    try {
      var url = new URL(trimmed, window.location.href);
      return (url.protocol === 'http:' || url.protocol === 'https:') ? url.href : null;
    } catch (error) {
      return null;
    }
  }

  function text(value) {
    return (typeof value === 'string' && value.trim()) ? value.trim() : null;
  }

  /**
   * Up to two initials for the avatar fallback. Punctuation is stripped first,
   * so a name field containing markup yields a dash rather than "<O".
   */
  function initials(name) {
    var parts = String(name || '')
      .replace(/[^\p{L}\p{N}\s]/gu, ' ')
      .trim()
      .split(/\s+/)
      .filter(Boolean);
    if (!parts.length) return '—';
    var first = parts[0].charAt(0);
    var last = parts.length > 1 ? parts[parts.length - 1].charAt(0) : '';
    return (first + last).toUpperCase();
  }

  function endpointUrl(config) {
    if (config.cacheBusting === 'none') return config.endpoint;
    var stamp = config.cacheBusting === 'always'
      ? String(Date.now())
      : new Date().toISOString().slice(0, 13).replace(/[-T]/g, ''); // YYYYMMDDHH
    return config.endpoint + (config.endpoint.indexOf('?') === -1 ? '?' : '&') + 'v=' + stamp;
  }

  function readConfig(mount) {
    var config = {};
    var key;
    for (key in DEFAULTS) if (Object.prototype.hasOwnProperty.call(DEFAULTS, key)) config[key] = DEFAULTS[key];

    var global = window.JG_WOL_CONFIG;
    if (global && typeof global === 'object') {
      for (key in global) if (Object.prototype.hasOwnProperty.call(global, key)) config[key] = global[key];
    }

    // Per-block data attributes win, so one pasted widget serves both the
    // homepage (a short teaser) and /testimonials (the full wall).
    var data = mount.dataset;
    if (data.endpoint) config.endpoint = data.endpoint;
    if (data.initial) config.initialCount = parseInt(data.initial, 10) || config.initialCount;
    if (data.batch) config.batchSize = parseInt(data.batch, 10) || config.batchSize;
    if (data.label) config.label = data.label;
    if (data.cacheBusting) config.cacheBusting = data.cacheBusting;

    config.initialCount = Math.max(1, config.initialCount);
    config.batchSize = Math.max(1, config.batchSize);
    return config;
  }

  function applyTheme(root, theme) {
    if (!theme) return;
    var map = {
      card: '--jg-wol-card', text: '--jg-wol-text', muted: '--jg-wol-muted',
      accent: '--jg-wol-accent', radius: '--jg-wol-radius', gap: '--jg-wol-gap',
      columnWidth: '--jg-wol-col',
      fontHeading: '--jg-wol-font-head', fontQuote: '--jg-wol-font-quote',
      fontBody: '--jg-wol-font-body'
    };
    Object.keys(map).forEach(function (key) {
      if (typeof theme[key] === 'string' && theme[key]) root.style.setProperty(map[key], theme[key]);
    });
  }

  /* ----------------------------------------------------------------- card */

  function buildCard(record, config, clamps, onToggle, onMedia) {
    var item = el('li', 'jg-wol__card');
    var figure = el('figure', 'jg-wol__figure');

    /* Attribution first: the person leads the card. */
    var caption = el('figcaption', 'jg-wol__by');
    var avatar = safeUrl(record.avatarUrl);
    var name = text(record.name);

    if (avatar) {
      var img = el('img', 'jg-wol__avatar');
      img.src = avatar;
      img.alt = '';                 // decorative: the name is adjacent text
      img.setAttribute('aria-hidden', 'true');
      img.loading = 'lazy';
      img.decoding = 'async';
      img.width = 44;
      img.height = 44;
      // Fall back to the monogram rather than showing a broken image.
      img.addEventListener('error', function () {
        var fallback = el('span', 'jg-wol__monogram', initials(name));
        fallback.setAttribute('aria-hidden', 'true');
        if (img.parentNode) img.parentNode.replaceChild(fallback, img);
        if (typeof onMedia === 'function') onMedia();
      });
      img.addEventListener('load', function () { if (typeof onMedia === 'function') onMedia(); });
      caption.appendChild(img);
    } else {
      var mono = el('span', 'jg-wol__monogram', initials(name));
      mono.setAttribute('aria-hidden', 'true');
      caption.appendChild(mono);
    }

    var who = el('div', 'jg-wol__who');
    var social = safeUrl(record.socialLink);
    var nameNode;
    if (name && social) {
      nameNode = el('a', 'jg-wol__name jg-wol__link', name);
      nameNode.href = social;
      nameNode.target = '_blank';
      nameNode.rel = 'noopener noreferrer nofollow';
      nameNode.appendChild(el('span', 'jg-wol__sr', ' (opens in a new tab)'));
    } else {
      nameNode = el('div', 'jg-wol__name', name || 'Anonymous');
    }
    who.appendChild(nameNode);

    // Role and company are independently optional. Many imported rows carry the
    // employer in both fields ("Lead PM @ Acme" plus company "Acme"), which
    // would render as "Lead PM @ Acme · Acme"; print it once instead.
    var role = text(record.roleTitle);
    var company = text(record.company);
    if (role && company && role.toLowerCase().indexOf(company.toLowerCase()) !== -1) company = null;
    var meta = [role, company].filter(Boolean).join(' · ');
    if (meta) who.appendChild(el('div', 'jg-wol__meta', meta));

    caption.appendChild(who);
    figure.appendChild(caption);

    /* Quote */
    var message = text(record.message);
    if (message) {
      var quote = el('blockquote', 'jg-wol__quote');
      var body = el('p', 'jg-wol__text', message);
      quote.appendChild(body);
      figure.appendChild(quote);

      // Only offer "Show more" when the text is genuinely clipped. Whether it
      // is depends on the final line height, so this cannot be decided here:
      // the webfonts have usually not loaded yet and the text reflows when
      // they do. The card registers itself and `refresh` re-measures once
      // fonts are ready, on resize, and whenever the layout is recomputed.
      body.classList.add('jg-wol__text--clamped');
      var toggle = el('button', 'jg-wol__more', 'Show more');
      toggle.type = 'button';
      toggle.hidden = true;
      toggle.setAttribute('aria-expanded', 'false');
      toggle.addEventListener('click', function () {
        var expanded = body.classList.toggle('jg-wol__text--clamped') === false;
        toggle.setAttribute('aria-expanded', String(expanded));
        toggle.textContent = expanded ? 'Show less' : 'Show more';
        if (typeof onToggle === 'function') onToggle();
      });
      figure.appendChild(toggle);
      clamps.push({ body: body, toggle: toggle });
    }

    var shot = safeUrl(record.attachedImageUrl);
    if (shot) {
      var image = el('img', 'jg-wol__shot');
      image.src = shot;
      image.loading = 'lazy';
      image.decoding = 'async';
      // The screenshot IS the testimonial when there is no message text.
      image.alt = message
        ? 'Screenshot shared by ' + (name || 'this client')
        : 'Testimonial screenshot from ' + (name || 'a client');
      image.addEventListener('load', function () { if (typeof onMedia === 'function') onMedia(); });
      image.addEventListener('error', function () {
        image.remove();
        if (typeof onMedia === 'function') onMedia();
      });
      figure.appendChild(image);
    }

    item.appendChild(figure);
    return item;
  }

  /* ---------------------------------------------------------------- mount */

  function mountWidget(mount) {
    if (mount.getAttribute('data-jg-wol-ready') === 'true') return;
    mount.setAttribute('data-jg-wol-ready', 'true');

    var config = readConfig(mount);
    mount.classList.add('jg-wol');
    applyTheme(mount, config.theme);

    var section = el('section', 'jg-wol__section');
    section.setAttribute('aria-label', config.label);
    mount.appendChild(section);

    var status = el('div', 'jg-wol__sr');
    status.setAttribute('role', 'status');
    status.setAttribute('aria-live', 'polite');
    section.appendChild(status);

    var grid = el('ul', 'jg-wol__grid');
    section.appendChild(grid);

    var foot = el('div', 'jg-wol__foot');
    section.appendChild(foot);

    function showSkeletons() {
      grid.textContent = '';
      for (var i = 0; i < Math.min(6, config.initialCount); i += 1) {
        var placeholder = el('li', 'jg-wol__skeleton');
        placeholder.setAttribute('aria-hidden', 'true');
        grid.appendChild(placeholder);
      }
      status.textContent = 'Loading testimonials…';
    }

    function showNote(message, actionLabel, onAction) {
      grid.textContent = '';
      foot.textContent = '';
      var note = el('div', 'jg-wol__note');
      note.appendChild(el('p', 'jg-wol__noteText', message));
      if (actionLabel) {
        var button = el('button', 'jg-wol__btn jg-wol__btn--ghost', actionLabel);
        button.type = 'button';
        button.addEventListener('click', onAction);
        note.appendChild(button);
      }
      grid.appendChild(note);
      status.textContent = message;
    }

    var all = [];
    var shown = 0;
    var clamps = [];
    var pending = false;

    /* Masonry: give each card a row span equal to its own measured height, so
       the next card in the column starts immediately below it. Replaces CSS
       multi-column, which Safari mis-measured. */
    function layout() {
      var cards = grid.querySelectorAll('.jg-wol__card');
      if (!cards.length) return;

      var gap = parseFloat(getComputedStyle(grid).columnGap) || 20;
      var single = grid.clientWidth > 0 &&
        getComputedStyle(grid).gridTemplateColumns.split(' ').length === 1;

      if (single) {
        // One column: plain flow is simpler and avoids rounding drift.
        grid.classList.remove('jg-wol__grid--masonry');
        Array.prototype.forEach.call(cards, function (card) { card.style.gridRowEnd = ''; });
        return;
      }

      // Measure with spans cleared, then apply, so heights are natural.
      grid.classList.remove('jg-wol__grid--masonry');
      Array.prototype.forEach.call(cards, function (card) { card.style.gridRowEnd = ''; });
      var heights = Array.prototype.map.call(cards, function (card) {
        return card.getBoundingClientRect().height;
      });
      grid.classList.add('jg-wol__grid--masonry');
      Array.prototype.forEach.call(cards, function (card, i) {
        card.style.gridRowEnd = 'span ' + Math.max(1, Math.ceil(heights[i] + gap));
      });
    }

    /** Re-decide which quotes are actually clipped, then re-run the layout. */
    function refresh() {
      clamps.forEach(function (entry) {
        if (entry.toggle.getAttribute('aria-expanded') === 'true') return;
        entry.body.classList.add('jg-wol__text--clamped');
        var clipped = entry.body.scrollHeight - entry.body.clientHeight > 4;
        entry.toggle.hidden = !clipped;
        if (!clipped) entry.body.classList.remove('jg-wol__text--clamped');
      });
      layout();
    }

    /** Coalesce the many triggers (images, fonts, resize) into one pass. */
    function scheduleRefresh() {
      if (pending) return;
      pending = true;
      requestAnimationFrame(function () {
        pending = false;
        refresh();
      });
    }

    function renderNext(count) {
      // The feed is already ordered (featured first, then newest). Rendering the
      // next slice as-is is what keeps the widget's order identical to the JSON.
      var slice = all.slice(shown, shown + count);
      var fragment = document.createDocumentFragment();
      var added = [];
      slice.forEach(function (record) {
        var card = buildCard(record, config, clamps, scheduleRefresh, scheduleRefresh);
        card.classList.add('jg-wol__card--enter');
        added.push(card);
        fragment.appendChild(card);
      });
      grid.appendChild(fragment);

      var firstNew = shown;
      shown += slice.length;
      updateFooter();
      status.textContent = 'Showing ' + shown + ' of ' + all.length + ' testimonials.';

      refresh();
      // Two frames: one for the browser to paint the cards at opacity 0 with
      // their spans applied, the next to start the transition.
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          added.forEach(function (card) { card.classList.remove('jg-wol__card--enter'); });
        });
      });

      return grid.children[firstNew] || null;
    }

    function updateFooter() {
      foot.textContent = '';
      if (shown >= all.length) return;                 // hide when all are visible
      var remaining = all.length - shown;
      var next = Math.min(config.batchSize, remaining);
      var button = el('button', 'jg-wol__btn', config.loadMoreLabel);
      button.type = 'button';
      button.appendChild(el('span', 'jg-wol__sr', ' testimonials (' + next + ' more, ' + remaining + ' remaining)'));
      button.addEventListener('click', function () {
        var firstAdded = renderNext(config.batchSize);
        // Move focus to the first new card so keyboard users are not dropped
        // back at the top of the list.
        if (firstAdded) {
          firstAdded.setAttribute('tabindex', '-1');
          firstAdded.focus({ preventScroll: true });
        }
      });
      foot.appendChild(button);
    }

    function load() {
      showSkeletons();
      // Fetched exactly once; "load more" only reveals what is already in memory.
      fetch(endpointUrl(config), { credentials: 'omit', mode: 'cors' })
        .then(function (response) {
          if (!response.ok) throw new Error('HTTP ' + response.status);
          return response.json();
        })
        .then(function (feed) {
          var records = feed && Array.isArray(feed.testimonials) ? feed.testimonials : null;
          if (!records) throw new Error('unexpected feed shape');

          all = records;
          shown = 0;
          grid.textContent = '';

          if (!all.length) {
            showNote(config.emptyMessage);
            return;
          }
          renderNext(config.initialCount);
        })
        .catch(function (error) {
          if (window.console && console.warn) console.warn('[jg-wol] ' + error.message);
          showNote(config.errorMessage, 'Try again', load);
        });
    }

    // Webfonts change line heights, which changes both which quotes are
    // clipped and how tall every card is.
    if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
      document.fonts.ready.then(scheduleRefresh).catch(function () {});
    }

    var resizeTimer;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(scheduleRefresh, 120);
    });

    load();
  }

  function init() {
    var mounts = document.querySelectorAll('[data-jg-wol]');
    Array.prototype.forEach.call(mounts, mountWidget);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  // Exposed so Squarespace's AJAX page transitions can re-scan for new blocks.
  window.JgWallOfLove = { init: init };
})();
</script>
